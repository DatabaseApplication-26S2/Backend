services:
  db:
    image: postgres:17
    container_name: crs-db
    environment:
      POSTGRES_DB: crs
      POSTGRES_USER: crs
      POSTGRES_PASSWORD: crs
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - crs-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crs -d crs"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: crs-redis
    ports:
      - "6379:6379"

volumes:
  crs-db-data:
