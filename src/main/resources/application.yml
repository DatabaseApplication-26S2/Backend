spring:
  application:
    name: backend
  profiles:
    default: local            # 프로파일을 지정하지 않으면 local로 실행
  datasource:
    url: jdbc:postgresql://localhost:5433/crs
    username: crs
    password: crs
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway가 만들고 JPA는 검사만 (D-01 확정)
    open-in-view: false       # D-01 확정
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    use-jackson2-defaults: true   # Jackson 3 기본값(키 알파벳 정렬 등) 대신 이식 전 응답 형식 유지
    deserialization:
      fail-on-unknown-properties: true   # BE-01: 정의되지 않은 본문 필드는 400 E09

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: http://localhost:5173

distributed-lock:
  wait-time: 5
  lease-time: 10

queue:
  waiting-key: waiting_queue
  active-key: active_users
  admit-batch-size: 50
  active-ttl-minutes: 5
  scheduler-fixed-delay-ms: 1000
