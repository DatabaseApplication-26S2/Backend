spring:
  application:
    name: backend
  profiles:
    default: local            # 프로파일을 지정하지 않으면 local로 실행
  datasource:
    url: jdbc:postgresql://localhost:5433/crs
    username: crs
    password: crs
    hikari:
      # 티켓 워커(queue.worker-concurrency)가 연결을 하나씩 쥐어도 접수·claim·스케줄 작업이 연결을 얻도록 워커 상한보다 크게 둔다(구현계획 4절 (6))
      maximum-pool-size: 32
      data-source-properties:
        # uuid 컬럼(course_inst_id, session_id 등)을 Java String으로 바인딩할 수 있게 한다
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway가 만들고 JPA는 검사만 (D-01 확정)
    open-in-view: false       # D-01 확정
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    use-jackson2-defaults: true   # Jackson 3 기본값(키 알파벳 정렬 등) 대신 이식 전 응답 형식 유지
    deserialization:
      fail-on-unknown-properties: true   # BE-01: 정의되지 않은 본문 필드는 400 E09
  task:
    scheduling:
      pool:
        # 기본 1개 스레드면 @Scheduled 작업 하나가 늦어질 때(예: 회계 잠금 대기) 리스 연장·회수도 함께 멈춘다(구현계획 4절 (8)).
        # @Scheduled 작업 4개(디스패처·회수·리스 연장·로그인 자격 증명 청소)가 서로 기다리지 않게 한다
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  frontend-origin: http://localhost:5173

queue:
  waiting-key: waiting_queue
  admit-batch-size: 50
  active-ttl-minutes: 5
  scheduler-fixed-delay-ms: 1000
  # 동시에 실행하는 티켓 핸들러 수(구현계획 4절 (6)). 한 배치의 과목별 묶음(과목 없는 티켓은 하나씩)이 가상 스레드 하나에서 돌고,
  # 핸들러는 트랜잭션 동안 DB 연결 1개를 쥔다.
  # spring.datasource.hikari.maximum-pool-size(32)보다 작게 둔다
  worker-concurrency: 16
  # 3단계 재투입(구현계획 4절 (8), D-07 확정): 리스 30초·한도 3회는 WaitingTicket 상수, 점검 주기 10초는 아래 값
  reclaim-fixed-delay-ms: 10000
  lease-renew-fixed-delay-ms: 10000
  reclaim-on-startup: true
